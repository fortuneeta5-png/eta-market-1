<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Créer un compte — EtaChop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
iframe{display:block;width:100%;height:100%;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="vendorAuth" title="Inscription à EtaChop" src="dashboard.html" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  const frame=document.getElementById('vendorAuth');
  let attempts=0;
  function selectSignup(){
    attempts++;
    try{
      const w=frame.contentWindow;
      if(w && typeof w.switchTab==='function'){
        w.switchTab('signup');
        return;
      }
    }catch(e){}
    if(attempts<30) setTimeout(selectSignup,150);
  }
  frame.addEventListener('load',function(){attempts=0;selectSignup();});
})();
</script>
</body>
</html>
