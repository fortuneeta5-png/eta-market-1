<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivre mes commandes — EtaChop</title>
<link rel="icon" href="etachop-icon-48.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#191919;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:white;padding:14px 20px;border-bottom:1px solid #eee}header img{height:42px;max-width:150px;object-fit:contain}
main{max-width:620px;margin:28px auto;padding:0 16px 40px}.panel{background:white;border:1px solid #eee;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000008}
h1{font-size:24px;margin:0 0 8px}p{color:#666;font-size:14px;line-height:1.55}.field{margin:18px 0}.field label{display:block;font-weight:650;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.btn{background:#e63946;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;width:100%;cursor:pointer}.btn:disabled{opacity:.55}
.msg{padding:12px;border-radius:10px;background:#f8f0f0;color:#a42a35;font-size:14px;margin:12px 0;display:none}.order{border:1px solid #eee;padding:16px;border-radius:14px;margin:14px 0}.order h3{margin:0 0 8px}.green{background:#09865f}.small{font-size:12px;color:#777}.hide{display:none}@media(max-width:480px){main{margin:18px auto}.panel{padding:18px}}
</style>
</head>
<body>
<header><a href="explore.html"><img src="etachop-logo.png" alt="EtaChop"></a></header>
<main><section class="panel">
<h1>Suivre mes commandes</h1>
<p>Vérifie ton adresse e-mail pour accéder en toute sécurité aux commandes qui lui sont associées.</p>
<div id="emailStep"><div class="field"><label for="email">Adresse e-mail</label><input type="email" autocomplete="email" id="email" placeholder="nom@exemple.com"></div><button class="btn" id="send">Envoyer le code</button></div>
<div id="codeStep" class="hide"><div class="field"><label for="code">Code reçu par e-mail</label><input inputmode="numeric" autocomplete="one-time-code" id="code" placeholder="Code de vérification"></div><button class="btn" id="verify">Vérifier le code</button><p class="small">Vérifie également tes courriers indésirables.</p></div>
<div id="message" class="msg"></div><div id="orders"></div><button id="logout" class="btn hide" style="background:#555;margin-top:12px">Changer d'adresse e-mail</button>
</section></main>
<script>
const SUPABASE_URL="https://reghryppfweynclehwgv.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZ2hyeXBwZndleW5jbGVod2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzU5OTEsImV4cCI6MjA5OTE1MTk5MX0.8AjXK3mQeu0JfzaFrj6dENVJOtouldRiMi2ESWA2IzM";
const $=id=>document.getElementById(id);let currentEmail="";
function showMsg(t,ok=false){$('message').textContent=t;$('message').style.display='block';$('message').style.background=ok?'#e9f8f1':'#f8f0f0';$('message').style.color=ok?'#08734f':'#a42a35'}
function clearMsg(){$('message').style.display='none'}
async function call(action,extra={}){const res=await fetch(SUPABASE_URL+'/functions/v1/order-tracking-otp',{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({action,email:currentEmail,...extra})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.error||'Erreur');return d}
$('send').onclick=async()=>{clearMsg();currentEmail=$('email').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(currentEmail)){showMsg('Saisis une adresse e-mail valide.');return}$('send').disabled=true;try{await call('send');$('emailStep').classList.add('hide');$('codeStep').classList.remove('hide');showMsg('Si cette adresse correspond à des commandes, le code a été envoyé. Vérifie aussi tes courriers indésirables. Le code expire après 10 minutes.',true)}catch(e){showMsg(e.message)}finally{$('send').disabled=false}};
$('verify').onclick=async()=>{clearMsg();const code=$('code').value.trim();if(!/^\d{6}$/.test(code)){showMsg('Saisis le code à 6 chiffres.');return}$('verify').disabled=true;try{const d=await call('verify',{code});$('codeStep').classList.add('hide');$('logout').classList.remove('hide');renderOrders(d.orders||[])}catch(e){showMsg(e.message)}finally{$('verify').disabled=false}};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderOrders(list){$('orders').innerHTML='';clearMsg();if(!list.length){showMsg('Aucune commande associée à cette adresse.');return}$('orders').innerHTML=list.map(o=>{const digital=o.product_type==='digital',date=new Date(o.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),amount=Number(o.amount_fcfa||0).toLocaleString('fr-FR')+' FCFA';let status=o.status==='cancelled'?'Annulée':o.status==='pending'?'En attente':o.status==='confirmed'?'Confirmée':o.status==='preparing'?'En préparation':o.status==='shipped'?'Expédiée':o.status==='delivered'?'Livrée':o.status;return '<div class="order"><h3>'+esc(o.product_name_snapshot||'Produit')+'</h3><p>'+esc(o.store_name||'EtaChop')+' · '+date+'</p><p><b>'+amount+'</b></p><p>Statut : <b>'+esc(status)+'</b></p>'+(!digital&&o.delivery_address?'<p>Adresse : '+esc(o.delivery_address)+' · '+esc(o.delivery_city||'')+' · '+esc(o.delivery_district||'')+'</p>':'')+(digital&&o.status!=='cancelled'?'<button class="btn green" onclick="downloadOrder(\''+esc(o.order_id)+'\',\''+esc(o.tracking_code)+'\')">Télécharger mon fichier</button>':'')+'</div>'}).join('')}
async function downloadOrder(order_id,tracking_code){try{const res=await fetch(SUPABASE_URL+'/functions/v1/digital-download',{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({order_id,tracking_code})});if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||'Téléchargement indisponible')}const blob=await res.blob();let name='EtaChop-produit';const cd=res.headers.get('Content-Disposition');const match=cd&&cd.match(/filename="?([^";]+)"?/i);if(match)name=match[1];const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){showMsg(e.message||'Impossible de préparer le téléchargement.')}}
$('logout').onclick=()=>{$('orders').innerHTML='';$('logout').classList.add('hide');$('codeStep').classList.add('hide');$('emailStep').classList.remove('hide');$('email').value=currentEmail;$('code').value='';clearMsg()};
</script></body></html>
