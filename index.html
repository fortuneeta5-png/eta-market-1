<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<title>EtaChop — La plateforme pour développer ton commerce</title>
<script>
(function () {
  const hash = window.location.hash || '';
  const query = window.location.search || '';
  const isRecovery = hash.includes('type=recovery');
  const destination = isRecovery
    ? 'public/dashboard.html' + query + hash
    : 'public/accueil.html';
  window.location.replace(destination);
})();
</script>
</head>
<body><p>Ouverture d'EtaChop… <a href="public/accueil.html">Continuer vers EtaChop</a></p></body>
</html>
